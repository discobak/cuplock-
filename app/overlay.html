<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cuplock Overlay</title>
<style>
:root{--a:#a78bfa;--b:#f472b6;--bg:#16131f;--bg3:#231f30;--fg:#efeaf7;--fg2:#b0a9c2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;font:600 12.5px var(--font,system-ui,sans-serif);color:var(--fg);user-select:none;-webkit-user-select:none}
.box{margin:6px;border-radius:16px;background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden;backdrop-filter:blur(10px)}
.head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px;cursor:move;background:linear-gradient(90deg,color-mix(in srgb,var(--a) 35%,transparent),color-mix(in srgb,var(--b) 25%,transparent))}
.head b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px}
.head button{width:22px;height:22px;border-radius:6px;border:0;background:rgba(0,0,0,.25);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.list{padding:6px;display:flex;flex-direction:column;gap:3px;max-height:190px;overflow-y:auto}
.p{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:10px}
.av{width:26px;height:26px;border-radius:50%;flex:none;background-size:cover;background-position:center;display:grid;place-items:center;font-weight:800;color:#fff;box-shadow:0 0 0 2px transparent;transition:box-shadow .1s}
.p.sp .av{box-shadow:0 0 0 2.5px #3ba55d,0 0 10px #3ba55d}
.p span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.p i{opacity:.7;font-style:normal}
.ctl{display:flex;gap:6px;padding:8px;border-top:1px solid rgba(255,255,255,.08)}
.ctl button{flex:1;height:34px;border-radius:10px;border:0;background:var(--bg3);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.ctl button.off{background:#ed4245;color:#fff}
.ctl button.leave{background:#ed4245;color:#fff;flex:.8}
.empty{padding:14px;color:var(--fg2);text-align:center}
svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.keys{padding:0 8px 8px;color:var(--fg2);font-size:10.5px;text-align:center}
</style></head><body>
<div class="box"><div class="head" data-tauri-drag-region><b data-tauri-drag-region id="lbl">Cuplock</b><button title="Abrir o Cuplock" onclick="cmd('open')"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3"/></svg></button><button title="Esconder (Ctrl Shift O)" onclick="cmd('hide')"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<div class="list" id="list"><div class="empty">Você não está em uma call.</div></div>
<div class="ctl" id="ctl" style="display:none">
<button id="mic" title="Microfone (Ctrl Shift M)" onclick="cmd('mic')"></button>
<button id="deaf" title="Áudio (Ctrl Shift D)" onclick="cmd('deaf')"></button>
<button class="leave" title="Sair da call" onclick="cmd('leave')"><svg viewBox="0 0 24 24"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.4l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9M22 2 2 22"/></svg></button></div>
<div class="keys">Ctrl Shift M · D · O</div></div>
<script>
const T = window.__TAURI__, esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MIC = '<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10a7 7 0 0 1-14 0M12 17v5"/></svg>', MICX = '<svg viewBox="0 0 24 24"><path d="M2 2l20 20M15 9.3V5a3 3 0 0 0-5.7-1.3M9 9v3a3 3 0 0 0 5.1 2.1M19 10a7 7 0 0 1-1 3.6M5 10a7 7 0 0 0 11.3 5.5M12 17v5"/></svg>';
const HP = '<svg viewBox="0 0 24 24"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>', HPX = HP.replace("</svg>", '<path d="M2 2l20 20"/></svg>');
function cmd(c) { T?.event?.emitTo("main", "ov-cmd", c); }
T?.event?.listen("ov-state", ({ payload: s }) => {
  const r = document.documentElement.style, t = s.theme || {};
  if (t.accent) { r.setProperty("--a", t.accent); r.setProperty("--b", t.accent2); r.setProperty("--bg", t.bg); r.setProperty("--bg3", t.bg3); r.setProperty("--fg", t.fg); r.setProperty("--fg2", t.fg2); r.setProperty("--font", t.font); }
  document.getElementById("lbl").textContent = s.inCall ? s.label : "Cuplock";
  document.getElementById("ctl").style.display = s.inCall ? "" : "none";
  document.getElementById("list").innerHTML = s.inCall ? s.peers.map(p => `<div class="p ${p.speaking ? "sp" : ""}"><div class="av" style="background-color:${esc(p.color)};${p.avatar ? `background-image:url('${esc(p.avatar)}')` : ""}">${p.avatar ? "" : esc(p.name[0] || "?").toUpperCase()}</div><span>${esc(p.name)}</span>${p.mic ? "" : "<i>🔇</i>"}</div>`).join("") : '<div class="empty">Você não está em uma call.</div>';
  const m = document.getElementById("mic"), d = document.getElementById("deaf");
  m.innerHTML = s.mic ? MIC : MICX; m.classList.toggle("off", !s.mic);
  d.innerHTML = s.deaf ? HPX : HP; d.classList.toggle("off", !!s.deaf);
});
addEventListener("contextmenu", e => e.preventDefault());
setTimeout(() => cmd("ready"), 300);
</script></body></html>
