<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Chamada no Cuplock</title>
<style>
:root{--a:#a78bfa;--b:#f472b6;--bg:#16131f;--bg3:#231f30;--fg:#efeaf7;--fg2:#b0a9c2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden;font:600 14px var(--font,system-ui,sans-serif);color:var(--fg);user-select:none;-webkit-user-select:none}
.card{position:absolute;inset:10px;border-radius:24px;background:var(--bg);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden;cursor:move;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--a),var(--b))}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.av{width:96px;height:96px;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font:800 40px var(--font,sans-serif);color:#fff;position:relative}
.av::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--a);animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
small{letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);font-weight:800;font-size:11px;margin-top:10px}
b{font-size:22px;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--fg2);font-size:13px}
.btns{display:flex;gap:16px;margin-top:16px}
button{width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;transition:transform .12s}
button:hover{transform:scale(1.08)}
.no{background:#ed4245}.ok{background:#3ba55d}
svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="card" data-tauri-drag-region>
  <div class="av" id="av" data-tauri-drag-region></div><small id="kind" data-tauri-drag-region>Chamada de voz</small><b id="nm" data-tauri-drag-region>…</b><span class="sub" data-tauri-drag-region>está te ligando no Cuplock</span>
  <div class="btns"><button class="no" title="Recusar" onclick="cmd('decline')"><svg viewBox="0 0 24 24"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.4l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9M22 2 2 22"/></svg></button>
  <button class="ok" title="Atender" onclick="cmd('voice')"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></button>
  <button class="ok" title="Atender com vídeo" onclick="cmd('video')"><svg viewBox="0 0 24 24"><path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg></button></div>
</div>
<script>
const T = window.__TAURI__;
function cmd(c) { T?.event?.emitTo("main", "ring-cmd", c); }
T?.event?.listen("ring-data", ({ payload: d }) => {
  const r = document.documentElement.style, t = d.theme || {};
  if (t.accent) { r.setProperty("--a", t.accent); r.setProperty("--b", t.accent2); r.setProperty("--bg", t.bg); r.setProperty("--bg3", t.bg3); r.setProperty("--fg", t.fg); r.setProperty("--fg2", t.fg2); r.setProperty("--font", t.font); }
  const av = document.getElementById("av");
  av.style.backgroundColor = d.color; av.style.backgroundImage = d.avatar ? `url('${d.avatar}')` : ""; av.textContent = d.avatar ? "" : (d.name[0] || "?").toUpperCase();
  document.getElementById("nm").textContent = d.name; document.getElementById("kind").textContent = d.video ? "Chamada de vídeo" : "Chamada de voz";
});
addEventListener("contextmenu", e => e.preventDefault());
addEventListener("keydown", e => { if (e.key === "Escape") cmd("decline"); if (e.key === "Enter") cmd("voice"); });
</script></body></html>
