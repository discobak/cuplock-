<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuplock</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link id="fontlink" rel="stylesheet" href="">
<style>
/* =========================================================
   Cuplock v2 — "ilhas" flutuantes sobre papel de parede.
   Quase tudo é controlado por variáveis que o app ajusta
   conforme as preferências do usuário (Configurações → Aparência).
   ========================================================= */
:root{
  --bg0:#0c0a12;--panel:rgba(22,19,31,.78);--bg1:#16131f;--bg2:#1b1826;--bg3:#231f30;--bg4:#2e2940;
  --line:rgba(255,255,255,.07);--hover:rgba(255,255,255,.05);
  --fg:#efeaf7;--fg2:#b0a9c2;--fg3:#736c85;
  --accent:#a78bfa;--accent2:#f472b6;--on-accent:#fff;
  --ok:#34d399;--idle:#fbbf24;--busy:#fb7185;
  --r:20px;--gap:10px;--blur:22px;--fs:15px;--font:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
  color-scheme:dark;
}
:root.light{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--fg);font:var(--fs)/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.reduce *{transition:none!important;animation:none!important}

/* papel de parede */
#wall{position:fixed;inset:-40px;z-index:0;background:var(--bg0);background-size:cover;background-position:center;filter:blur(var(--wall-blur,0px))}
#wall-dim{position:fixed;inset:0;z-index:0;background:var(--bg0);opacity:var(--wall-dim,.35);pointer-events:none}
#wall.anim{animation:drift 28s ease-in-out infinite alternate;background-size:160% 160%}
@keyframes drift{from{background-position:0% 30%}to{background-position:100% 70%}}

/* layout em ilhas */
#app{position:relative;z-index:1;display:flex;height:100%;height:100dvh;padding:var(--gap);gap:var(--gap)}
.isle{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(var(--blur)) saturate(1.5);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);box-shadow:0 10px 40px rgba(0,0,0,.18)}
.noglass .isle,.noglass .panel,.noglass .modal,.noglass .ctx,.noglass .settings{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

/* dock */
.rail{width:74px;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .sep{width:28px;height:3px;border-radius:3px;background:var(--line);flex:none}
.pill{position:relative;width:48px;height:48px;flex:none;border-radius:calc(var(--r) * .7);display:grid;place-items:center;background:var(--bg3);font-size:22px;font-weight:700;color:var(--fg);transition:transform .18s var(--ease),box-shadow .2s,background .2s}
.pill:hover{transform:translateY(-2px) scale(1.04);background:var(--bg4);text-decoration:none}
.pill.on{box-shadow:0 0 0 2px var(--bg1),0 0 0 4px var(--accent),0 6px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.pill.logo{background:var(--grad);color:var(--on-accent)}
.pill.ghost{background:transparent;border:2px dashed var(--bg4);color:var(--fg2)}.pill.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.pill .badge{position:absolute;right:-3px;top:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--busy);border:3px solid var(--bg1);box-sizing:content-box}
.tip{position:fixed;z-index:99;background:var(--bg4);color:var(--fg);padding:6px 11px;border-radius:10px;font-size:13px;font-weight:650;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap;animation:pop .15s var(--ease)}

/* barra lateral */
.side{width:256px;flex:none;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.side-head{flex:none;padding:14px 14px 8px}
.srv-banner{height:112px;border-radius:calc(var(--r) - 6px);margin:8px 8px 0;padding:12px 14px;display:flex;align-items:flex-end;justify-content:space-between;color:#fff;font-weight:800;font-size:17px;cursor:pointer;text-shadow:0 1px 10px rgba(0,0,0,.4);position:relative;overflow:hidden}
.srv-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.35))}
.srv-banner>*{position:relative;z-index:1}
.side-scroll{flex:1;overflow-y:auto;padding:6px 8px 8px}
.side-label{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--fg3);padding:14px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:calc(var(--r) * .55);color:var(--fg2);cursor:pointer;font-weight:550;user-select:none;transition:background .12s,color .12s,transform .12s;min-width:0}
.item:hover{background:var(--hover);color:var(--fg);text-decoration:none}
.item.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--fg)}
.item.on .hash{color:var(--accent)}
.item .hash{color:var(--fg3);font-size:17px;width:20px;text-align:center;flex:none;display:grid;place-items:center}
.item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{display:block;font-size:12px;color:var(--fg3);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.item.unread{color:var(--fg);font-weight:750}.item.unread::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.me-bar{flex:none;margin:8px;padding:8px;border-radius:calc(var(--r) - 6px);background:var(--bg3);display:flex;align-items:center;gap:10px}
.me-bar .who{flex:1;min-width:0;line-height:1.25;cursor:pointer}.me-bar .who small{color:var(--fg3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* área principal */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line);min-width:0}
.top h1{font-size:16.5px;font-weight:800;white-space:nowrap;letter-spacing:-.01em}
.top .topic{color:var(--fg3);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.top .spacer{flex:1}
.body{flex:1;display:flex;min-height:0}
.content{flex:1;overflow-y:auto;min-width:0}
.members{width:250px;flex:none;overflow-y:auto;padding:8px;margin:10px 10px 10px 0;border-radius:calc(var(--r) - 4px);background:color-mix(in srgb,var(--bg3) 70%,transparent)}

/* avatar */
.avatar{position:relative;flex:none;width:34px;height:34px;border-radius:36%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;background-size:cover!important;background-position:center!important}
.round .avatar{border-radius:50%}
.avatar.lg{width:42px;height:42px;font-size:17px}.avatar.xl{width:92px;height:92px;font-size:36px;border:5px solid var(--bg1)}
.avatar .dot{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;border:3px solid var(--bg1);box-sizing:content-box;background:var(--fg3)}
.avatar.xl .dot{width:18px;height:18px;border-width:5px;right:0;bottom:0}
.dot.online{background:var(--ok)!important}.dot.idle{background:var(--idle)!important}.dot.busy{background:var(--busy)!important}
.activity{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg2);overflow:hidden}
.activity b{color:var(--fg);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-card{display:flex;gap:12px;align-items:center;padding:12px;border-radius:calc(var(--r) * .6);background:var(--bg3);margin-top:10px}
.act-ico{width:48px;height:48px;border-radius:30%;display:grid;place-items:center;font-size:24px;background:var(--grad);flex:none;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.act-card small{display:block;color:var(--fg3);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* chat — comum */
.chat{display:flex;flex-direction:column;min-height:100%;justify-content:flex-end;padding:16px 0 8px}
.welcome{padding:18px 22px 22px}.welcome .big{width:72px;height:72px;border-radius:32%;background:var(--grad);display:grid;place-items:center;font-size:34px;color:var(--on-accent);margin-bottom:12px}
.welcome h2{font-size:28px;font-weight:800;letter-spacing:-.02em}.welcome p{color:var(--fg2)}
.text{word-wrap:break-word;white-space:pre-wrap}
.text code{background:rgba(0,0,0,.25);padding:1px 6px;border-radius:6px;font-size:.9em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.text pre{background:rgba(0,0,0,.3);padding:10px 12px;border-radius:10px;margin:4px 0;overflow-x:auto;font-family:ui-monospace,monospace;font-size:.9em}
.text .mention{background:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--accent);padding:0 4px;border-radius:5px;font-weight:700}
.daysep{display:flex;align-items:center;justify-content:center;margin:18px 20px 6px}
.daysep span{font-size:11.5px;font-weight:750;color:var(--fg3);background:var(--bg3);padding:3px 12px;border-radius:999px}
.load-more{display:block;margin:8px auto;color:var(--fg2);font-size:13px;padding:6px 14px;border-radius:999px;background:var(--bg3)}.load-more:hover{color:var(--fg)}

/* chat — balões */
.bgroup{display:flex;gap:10px;padding:3px 18px;align-items:flex-end;animation:rise .25s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bgroup .bcol{display:flex;flex-direction:column;gap:3px;max-width:min(72%,640px);min-width:0;align-items:flex-start}
.bgroup .bname{font-size:12.5px;font-weight:750;margin:6px 0 1px 12px;cursor:pointer}
.bgroup .bname time{color:var(--fg3);font-weight:500;margin-left:6px}
.bubble{position:relative;padding:8px 13px;border-radius:calc(var(--r) * .85);background:var(--bg3);color:var(--fg);max-width:100%;transition:filter .12s}
.bubble:hover{filter:brightness(1.08)}
.bubble .t{float:right;margin:6px 0 -4px 10px;font-size:10.5px;color:var(--fg3);opacity:0;transition:opacity .15s}
.bubble:hover .t{opacity:1}
.bgroup.mine{flex-direction:row-reverse}
.bgroup.mine .bcol{align-items:flex-end}
.bgroup.mine .bubble{background:var(--grad);color:var(--on-accent)}
.bgroup.mine .bubble .t{color:inherit;opacity:0}.bgroup.mine .bubble:hover .t{opacity:.7}
.bgroup.mine .text a,.bgroup.mine .text .mention{color:inherit;text-decoration:underline}
.bgroup .bubble:last-child{border-bottom-left-radius:6px}
.bgroup.mine .bubble:last-child{border-bottom-left-radius:calc(var(--r) * .85);border-bottom-right-radius:6px}
.bgroup .av-slot{width:34px;flex:none}
.bubble.pending{opacity:.55}.bubble.failed{outline:2px solid var(--busy);cursor:pointer}

/* chat — clássico */
.msg{display:flex;gap:14px;padding:3px 20px;position:relative}
.msg:hover{background:var(--hover)}
.msg-body{flex:1;min-width:0}.msg.cont .msg-body{margin-left:56px}
.msg .name{font-weight:750;margin-right:6px;cursor:pointer}
.msg time{color:var(--fg3);font-size:12px}
.msg.pending .text{opacity:.5}.msg.failed .text{color:var(--busy);cursor:pointer}
.group{margin-top:14px}
.compact .group{margin-top:4px}.compact .msg{padding-top:0;padding-bottom:0}.compact .msg .avatar{display:none}.compact .msg.cont .msg-body{margin-left:0}

/* composer */
.composer{flex:none;padding:0 16px 16px}
.composer-box{display:flex;align-items:flex-end;gap:6px;background:var(--bg3);border-radius:calc(var(--r) * .9);padding:6px 6px 6px 16px;border:1px solid var(--line);transition:border-color .15s,box-shadow .2s}
.composer-box:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
.composer textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:200px;padding:8px 0;line-height:1.4}
.send-btn{width:40px;height:40px;border-radius:calc(var(--r) * .6);background:var(--grad);color:var(--on-accent);display:grid;place-items:center;flex:none;transition:transform .12s}
.send-btn:hover{transform:scale(1.06)}.send-btn svg{width:18px;height:18px}
.typing{height:20px;font-size:12.5px;color:var(--fg2);padding:3px 6px 0;display:flex;align-items:center;gap:6px}
.typing i{display:inline-flex;gap:3px}.typing i b{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite}
.typing i b:nth-child(2){animation-delay:.15s}.typing i b:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-3px);opacity:1}}

/* elementos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:calc(var(--r) * .55);font-weight:700;background:var(--grad);color:var(--on-accent);transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.1);text-decoration:none}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--bg4);color:var(--fg)}.btn.danger{background:var(--busy);color:#fff}.btn.ok{background:var(--ok);color:#052e1c}.btn.sm{padding:6px 13px;font-size:13.5px}
.icon-btn{width:36px;height:36px;border-radius:calc(var(--r) * .5);display:grid;place-items:center;color:var(--fg2);flex:none;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--hover);color:var(--fg)}.icon-btn.on{color:var(--accent)}
.icon-btn svg{width:20px;height:20px}
.input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:calc(var(--r) * .55);padding:10px 13px;outline:0;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
textarea.input{resize:vertical}
label.f{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--fg2);margin:16px 0 7px}
.err{color:var(--busy);font-size:13.5px;min-height:20px;margin-top:8px}
.muted{color:var(--fg3)}.small{font-size:13px}
.tabs{display:flex;gap:4px;align-items:center;background:var(--bg3);padding:4px;border-radius:calc(var(--r) * .6);width:fit-content}
.tab{padding:5px 13px;border-radius:calc(var(--r) * .45);color:var(--fg2);font-weight:700;font-size:14px}.tab:hover{color:var(--fg)}.tab.on{background:var(--bg1);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tab.add.on{background:var(--grad);color:var(--on-accent)}
.empty{display:grid;place-items:center;text-align:center;padding:56px 20px;color:var(--fg3);gap:10px}.empty .e{font-size:52px}
.card{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r)}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--bg4);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.toggle.on{background:var(--grad)}.toggle.on::after{transform:translateX(18px)}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:calc(var(--r) * .5);background:var(--bg3);border:2px solid transparent;font-weight:650;font-size:13.5px;color:var(--fg2)}
.seg button.on{border-color:var(--accent);color:var(--fg);background:color-mix(in srgb,var(--accent) 12%,var(--bg3))}

/* amigos */
.page{padding:22px 26px;max-width:980px}
.friend-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:calc(var(--r) * .6);cursor:pointer;transition:background .12s}
.friend-row:hover{background:var(--hover)}
.friend-row .grow{flex:1;min-width:0}
.friend-row .acts{display:flex;gap:6px;opacity:.6;transition:opacity .15s}.friend-row:hover .acts{opacity:1}
.friend-row .acts .icon-btn{background:var(--bg3)}
.now-playing{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:6px 0 18px}

/* explorar */
.hero{padding:42px 34px;border-radius:var(--r);margin:18px 22px 6px;background:var(--grad);color:var(--on-accent);position:relative;overflow:hidden}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.02em;max-width:560px}.hero p{opacity:.92;margin:6px 0 18px;max-width:520px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.15)}
.hero::before{width:260px;height:260px;right:-60px;top:-90px}.hero::after{width:140px;height:140px;right:140px;bottom:-70px}
.hero .input{max-width:440px;background:rgba(255,255,255,.95);color:#111;border:0;position:relative;z-index:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:16px 22px 30px}
.srv-card{overflow:hidden;display:flex;flex-direction:column;transition:transform .2s var(--ease),box-shadow .2s;cursor:pointer}
.srv-card:hover{transform:translateY(-4px) rotate(-.3deg);box-shadow:0 18px 40px rgba(0,0,0,.25)}
.srv-card .b{height:92px}.srv-card .i{width:58px;height:58px;border-radius:32%;background:var(--bg3);border:4px solid var(--bg3);display:grid;place-items:center;font-size:28px;margin:-30px 0 0 14px}
.srv-card .c{padding:8px 16px 16px;flex:1;display:flex;flex-direction:column;gap:6px}.srv-card h3{font-size:16px}
.srv-card p{color:var(--fg2);font-size:13.5px;flex:1}
.srv-card .meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--fg3)}

/* telas centrais */
.center{position:fixed;inset:0;z-index:1;display:grid;place-items:center;padding:20px;overflow-y:auto}
.panel{width:100%;max-width:440px;background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(1.5);border:1px solid var(--line);border-radius:calc(var(--r) + 6px);padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .4s var(--ease)}
.panel h1{font-size:25px;font-weight:800;letter-spacing:-.02em}.panel .sub{color:var(--fg2);margin-top:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:22px;letter-spacing:-.01em}.brand img{width:38px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.invite-srv{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin:18px 0}
.invite-srv .i{width:88px;height:88px;border-radius:30%;display:grid;place-items:center;font-size:44px;color:#fff}

/* configurações */
.settings{position:fixed;inset:var(--gap);z-index:40;display:flex;background:var(--panel);backdrop-filter:blur(calc(var(--blur) + 10px)) saturate(1.5);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;animation:pop .25s var(--ease)}
.settings nav{width:250px;flex:none;padding:28px 12px;overflow-y:auto;border-right:1px solid var(--line)}
.settings section{flex:1;padding:36px 44px;overflow-y:auto}
.settings section>div{max-width:720px}
.settings h2{font-size:24px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em}
.settings h2+p{color:var(--fg3);margin-bottom:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .l b{display:block;font-weight:700}.row .l span{color:var(--fg3);font-size:13.5px}
.row .ctl{flex:none;min-width:0;display:flex;align-items:center;gap:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{width:34px;height:34px;border-radius:32%;border:3px solid transparent;transition:transform .15s;position:relative}.sw:hover{transform:scale(1.1)}.sw.on{border-color:var(--fg)}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.choice{border-radius:calc(var(--r) * .7);border:2px solid var(--line);padding:8px;text-align:center;font-weight:700;font-size:13px;background:var(--bg3);transition:border-color .15s,transform .15s}
.choice:hover{transform:translateY(-2px)}.choice.on{border-color:var(--accent)}
.choice .pv{height:62px;border-radius:calc(var(--r) * .5);margin-bottom:8px;position:relative;overflow:hidden;background-size:cover;background-position:center}
.close-x{position:absolute;right:22px;top:22px;z-index:2}
.profile-card{border-radius:var(--r);overflow:hidden;background:var(--bg3);border:1px solid var(--line)}
.profile-card .b{height:104px;background-size:cover}
.profile-card .c{padding:0 18px 18px}.profile-card .avatar.xl{margin-top:-46px;border-color:var(--bg3)}
.profile-card .avatar.xl .dot{border-color:var(--bg3)}
.pronouns{font-size:12.5px;color:var(--fg3);font-weight:600}
.cstatus{margin-top:6px;font-size:14px;color:var(--fg2)}
.game-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:calc(var(--r) * .5);background:var(--bg3);margin-top:6px}

/* modais e menus */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:grid;place-items:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:460px;background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(1.5);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:pop .25s var(--ease)}
.modal h2{font-size:21px;font-weight:800;text-align:center}.modal .sub{text-align:center;color:var(--fg2);margin-top:4px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.copy-row{display:flex;gap:8px;background:var(--bg3);border-radius:calc(var(--r) * .55);padding:5px 5px 5px 13px;align-items:center;border:1px solid var(--line)}
.copy-row input{flex:1;background:none;border:0;outline:0;min-width:0;font-variant-ligatures:none;font-feature-settings:"calt" 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--bg4);border:1px solid var(--line);padding:11px 18px;border-radius:999px;z-index:90;box-shadow:0 12px 36px rgba(0,0,0,.35);animation:pop .2s;font-weight:600}
.ctx{position:fixed;z-index:70;background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(1.5);border:1px solid var(--line);border-radius:calc(var(--r) * .7);padding:6px;min-width:210px;box-shadow:0 16px 40px rgba(0,0,0,.4);animation:pop .12s}
.ctx button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:calc(var(--r) * .45);font-size:14px;font-weight:600;color:var(--fg2);text-align:left}
.ctx button:hover{background:var(--grad);color:var(--on-accent)}.ctx button.danger{color:var(--busy)}.ctx button.danger:hover{background:var(--busy);color:#fff}

/* dev */
.dev pre{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;font:12.5px/1.5 ui-monospace,monospace;max-height:340px;white-space:pre-wrap}
.dev .route{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-family:ui-monospace,monospace;font-size:13px}
.dev .route a{flex:1}
.stat{padding:14px 16px}.stat b{font-size:26px;display:block;font-weight:800}.stat span{color:var(--fg3);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:12px 0 24px}

.conn{position:fixed;top:12px;left:50%;z-index:95;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;background:var(--idle);color:#2a1d00;transform:translate(-50%,-160%);transition:transform .25s var(--ease)}
.conn.show{transform:translate(-50%,0)}
.mobile-only,.mtabs{display:none!important}
.msg .hover-time{position:absolute;left:20px;width:44px;text-align:center;top:6px;font-size:11px;color:var(--fg3);opacity:0}
.msg.cont:hover .hover-time{opacity:1}
@media (max-width:820px){
  .members{display:none}
  .mobile-only{display:grid!important}
  .settings .mtabs{display:flex!important}
  .prof-grid{grid-template-columns:1fr!important}
  #app.nav-closed .rail,#app.nav-closed .side{display:none}
  #app:not(.nav-closed) .main{display:none}
  #app:not(.nav-closed) .side{flex:1;width:auto}
  .settings nav{display:none}.settings section{padding:60px 18px 30px}
  .hero{margin:12px;padding:30px 22px}.grid{padding:12px}.page{padding:16px}
  .bgroup .bcol{max-width:85%}
  #callpanel{height:min(62%,560px)}
  .tiles{grid-template-columns:1fr!important;grid-auto-rows:minmax(120px,1fr)}
  .cbtn{width:44px;height:44px}.call-ctl{gap:8px}
  .updcard{top:auto;bottom:16px}
}

/* ---------- v3: calls ---------- */
#callpanel{flex:none;margin:10px 10px 0;border-radius:calc(var(--r) - 4px);background:#07060c;padding:12px;display:flex;flex-direction:column;gap:10px;height:min(54%,480px);min-height:240px;resize:vertical;overflow:hidden;position:relative;animation:pop .25s var(--ease)}
#callpanel.full{position:fixed;inset:var(--gap);z-index:50;max-height:none;margin:0;border-radius:var(--r)}
.tiles{flex:1;display:grid;gap:10px;min-height:0;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));grid-auto-rows:minmax(150px,1fr);overflow:auto}
.tiles[data-n="1"]{grid-template-columns:minmax(0,560px);justify-content:center}
.tiles[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{position:relative;border-radius:calc(var(--r) * .7);background:#14121c;overflow:hidden;display:grid;place-items:center;outline:3px solid transparent;transition:outline-color .12s;min-height:140px}
.tile.speaking{outline-color:var(--ok)}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
.tile.has-video video{display:block}.tile.has-video .tile-av{display:none}
.tile.is-screen video{object-fit:contain}
.tile.mirror video{transform:scaleX(-1)}
.tile.focus{grid-column:1/-1;grid-row:span 2}
.tile-av .avatar{width:84px;height:84px;font-size:34px;border:0}
.tile-name{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);background:rgba(0,0,0,.6);color:#fff;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:650;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-name .mut svg{width:14px;height:14px;color:var(--busy);display:block}
.waiting{text-align:center;color:#aaa}
.call-ctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.cbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#2a2735;color:#fff;transition:transform .12s,background .15s}
.cbtn:hover{transform:scale(1.07)}.cbtn svg{width:22px;height:22px}
.cbtn.off{background:#fff;color:#111}.cbtn.on{background:var(--grad)}
.cbtn.danger{background:var(--busy)}.cbtn.ok{background:var(--ok);color:#052e1c}
.live-pill{font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok);cursor:pointer;white-space:nowrap}
.live-pill.join{background:var(--ok);color:#052e1c}
.callbar{margin:8px 8px 0;padding:8px 8px 8px 12px;border-radius:calc(var(--r) - 6px);background:color-mix(in srgb,var(--ok) 14%,var(--bg3));display:flex;align-items:center;gap:4px}
.callbar .live{color:var(--ok);font-size:13px;display:block}.callbar small{color:var(--fg3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.incall{font-size:11.5px;color:var(--ok);font-weight:700}
.voice-users{display:flex;flex-wrap:wrap;gap:4px;padding:2px 10px 6px 40px}
.voice-users .avatar{width:22px;height:22px;font-size:10px}
[data-voice] .avatar{transition:box-shadow .12s}
[data-voice].speaking .avatar{box-shadow:0 0 0 2px var(--bg1),0 0 0 4px var(--ok)}
.incoming-bg{position:fixed;inset:0;z-index:98;display:grid;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);animation:fade .2s}
.incoming{width:min(340px,calc(100% - 32px));padding:30px 24px 26px;border-radius:calc(var(--r) + 10px);background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(1.5);border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;animation:pop .3s var(--ease)}
.ring-av{animation:ringpulse 1.2s infinite;border-radius:50%;margin-bottom:10px}
.ring-av .avatar.xl{width:108px;height:108px;font-size:42px;border:0}
.cbtn.big{width:60px;height:60px}.cbtn.big svg{width:26px;height:26px}
@keyframes ringpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
/* ---------- v3: fotos ---------- */
.att{cursor:zoom-in;border-radius:calc(var(--r) * .6);overflow:hidden;max-width:min(340px,100%);background:rgba(0,0,0,.15);margin:2px 0}
.att img{display:block;width:100%;max-height:380px;object-fit:cover}
.bubble.photo{padding:4px;max-width:352px}.bubble.photo .text{padding:4px 9px 4px}
.bubble.only{background:transparent!important;padding:0}
.msg .att{margin-top:4px}
.pending{display:flex;gap:8px;flex-wrap:wrap;padding:0 4px 8px}
.pf{position:relative;width:84px;height:84px;border-radius:calc(var(--r) * .5);overflow:hidden;background:var(--bg3)}
.pf img{width:100%;height:100%;object-fit:cover}
.pf button{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:11px}
.pf span{position:absolute;left:4px;bottom:4px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;padding:1px 6px;border-radius:6px}
.attach-btn{background:var(--bg4);border-radius:50%;width:32px;height:32px;margin-bottom:4px}
#chatcol.dropping{outline:3px dashed var(--accent);outline-offset:-8px;border-radius:var(--r)}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;animation:fade .15s}
.lightbox img{max-width:100%;max-height:calc(100% - 70px);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb-bar{display:flex;gap:8px;align-items:center;color:#ddd;font-size:13px}.lb-bar span{margin-right:8px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- v3: atualização ---------- */
.updcard{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:97;display:flex;align-items:center;gap:12px;width:min(520px,calc(100% - 32px));padding:12px 12px 12px 16px;border-radius:calc(var(--r) + 2px);background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(1.5);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.4);animation:pop .3s var(--ease)}
.updcard small{display:block;color:var(--fg3)}

body[data-theme=v2015] .settings nav{background:#2e3136;border-right:0}
body[data-theme=v2015] .modal,body[data-theme=v2015] .panel,body[data-theme=v2015] .ann,body[data-theme=v2015] .incoming{background:#36393e;border-radius:5px;border:0;backdrop-filter:none}
body[data-theme=v2015] .ctx{background:#18191c;border-radius:4px;backdrop-filter:none}
body[data-theme=v2015] .ctx button:hover{background:#7289da}
body[data-theme=v2015] .toggle.on{background:#43b581}
body[data-theme=v2015] .rtag.staff{background:#7289da;box-shadow:none;border-radius:3px}
body[data-theme=v2015] .center{background:#36393e}
body[data-theme=v2015] .hero{border-radius:5px;background:#7289da}
/* ---------- ícones / v3.6 ---------- */
.ic{display:inline-block;vertical-align:-.18em;flex:none}
.hash .ic{vertical-align:middle}
.empty .e .ic{opacity:.55}
.hero-ic{width:56px;height:56px;border-radius:30%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);flex:none}
.admin-row .hero-ic,.updcard .hero-ic{width:42px;height:42px}
.searchbtn{display:flex!important;align-items:center;gap:8px;text-align:left;color:var(--fg3);padding:8px 12px;font-size:13.5px}
.seg button .ic,.tab .ic,.btn .ic,.ctx button .ic,.item .ic{vertical-align:-.2em}
.ckrow{display:flex;align-items:center;gap:8px}.ckrow.yes{color:var(--ok)}.ckrow.no{color:var(--busy)}
.invlink{display:inline-flex;align-items:center;gap:4px}
.pill.logo{background:transparent!important;box-shadow:none}
.pill.logo:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)!important}
.pill.logo.on{box-shadow:0 0 0 2px var(--accent)!important}
.cuplogo{display:block;filter:drop-shadow(0 3px 8px color-mix(in srgb,var(--accent) 45%,transparent))}
.pa .heart{display:inline-grid}
.vplay{display:grid;place-items:center}
/* anexos: vídeo e áudio */
.att.vid{cursor:default;background:#000;max-width:min(420px,100%)}
.att.vid video{display:block;width:100%;max-height:420px;background:#000}
.afile{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:calc(var(--r) * .6);background:rgba(0,0,0,.18);min-width:260px;max-width:380px}
.afile-ic{width:40px;height:40px;border-radius:30%;display:grid;place-items:center;background:var(--grad);color:var(--on-accent);flex:none}
.afile-main{flex:1;min-width:0}.afile-main b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.afile audio{width:100%;height:32px}
.pf.video video{width:100%;height:100%;object-fit:cover}
.pf-badge{position:absolute;left:4px;top:4px;color:#fff;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 4px;display:grid}
.pf-audio{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--accent);padding:6px;text-align:center}
.pf-audio small{font-size:10px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pf button{display:grid;place-items:center}
/* responder */
.brow{position:relative;display:flex;align-items:center;gap:6px;max-width:100%}
.bgroup.mine .brow{flex-direction:row-reverse}
.mact{display:flex;gap:2px;opacity:0;transition:opacity .12s;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.mact button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--fg2)}
.mact button:hover{background:var(--hover);color:var(--fg)}
.mact button svg{width:16px;height:16px}
.brow:hover .mact,.msg:hover .mact{opacity:1}
.msg .mact{position:absolute;right:16px;top:-12px;z-index:2}
.rquote{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 8px;margin:0 0 4px;border-left:3px solid var(--accent);border-radius:6px;background:rgba(0,0,0,.14);cursor:pointer;max-width:420px;overflow:hidden}
.rquote span{opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bgroup.mine .rquote{border-left-color:rgba(255,255,255,.8);background:rgba(0,0,0,.15)}
.replybar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;margin-bottom:6px;border-radius:calc(var(--r) * .6);background:var(--bg3);border-left:3px solid var(--accent);font-size:13px}
.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
/* imagens de servidor */
.srv-img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.srv-img.tiny{width:18px;height:18px;border-radius:5px;display:inline-block;vertical-align:middle}
.pill .srv-img{border-radius:calc(var(--r) * .7)}
.sb-ic{width:30px;height:30px;border-radius:30%;overflow:hidden;display:grid;place-items:center;flex:none;font-size:18px}
.srv-card .i{overflow:hidden}.invite-srv .i{overflow:hidden;position:relative}
.inv-ban{height:110px;border-radius:calc(var(--r) * .7);margin-bottom:-44px}
.invite-srv .i{margin-left:auto;margin-right:auto;border:4px solid var(--bg2)}
.srv-edit-pv{border-radius:var(--r);overflow:hidden;background:var(--bg3);padding-bottom:12px}
.srv-edit-pv .b{height:96px}.srv-edit-pv .i{width:64px;height:64px;border-radius:30%;overflow:hidden;background:var(--bg2);border:4px solid var(--bg3);display:grid;place-items:center;font-size:30px;margin:-32px 0 4px 14px}
.srv-edit-pv b{margin-left:16px}
/* janelas livres */
#app.free{display:block}
#app.free>.isle{position:absolute;margin:0}
#app.free>.isle.dragging{opacity:.92;box-shadow:0 20px 60px rgba(0,0,0,.4);z-index:5;transition:none}
#app.free>.isle:hover>.grip{opacity:1}
.grip{position:absolute;z-index:6;opacity:0;transition:opacity .15s;touch-action:none}
.grip.move{top:3px;left:50%;transform:translateX(-50%);width:44px;height:14px;border-radius:7px;background:color-mix(in srgb,var(--accent) 70%,transparent);color:#fff;display:grid;place-items:center;cursor:grab}
.grip.move:active{cursor:grabbing}
.grip.size{right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;border-right:3px solid var(--accent);border-bottom:3px solid var(--accent);border-radius:0 0 6px 0}
body.nosel{user-select:none}
/* melhores amigos */
.bff .avatar{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--bff)}
.friend-row.bff{background:color-mix(in srgb,var(--bff) 9%,transparent)}
.bff-tag{color:var(--bff);vertical-align:middle}
.item.bff .grow{color:var(--bff)}
.icon-btn.on .ic{color:#fbbf24}
.bff-colors{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.bff-c{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.bff-c.on,.bff-c:hover{border-color:var(--fg)}
/* ---------- v3.7: barra de título ---------- */
#titlebar{position:fixed;top:0;left:0;right:0;height:34px;z-index:300;display:flex;align-items:center;gap:6px;padding-left:8px;color:var(--fg2);font-size:13px;font-weight:600;user-select:none;-webkit-user-select:none;
  background:color-mix(in srgb,var(--bg0) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
#titlebar button{height:28px;min-width:30px;border-radius:7px;display:grid;place-items:center;color:var(--fg2);background:transparent}
#titlebar button:hover{background:var(--hover);color:var(--fg)}
.tb-nav{display:flex;gap:2px}
.tb-title{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:50%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--fg)}
.tb-ic{width:18px;height:18px;border-radius:5px;overflow:hidden;display:grid;place-items:center;flex:none;font-size:13px}
.tb-ic svg{width:18px;height:18px}
.tb-acts{margin-left:auto;display:flex;align-items:center;gap:2px;height:100%}
.tb-sep{width:1px;height:18px;background:var(--line);margin:0 6px}
#titlebar button.win{height:34px;width:46px;border-radius:0}
#titlebar button.win.close:hover{background:#e81123;color:#fff}
body.has-tb #app{height:calc(100% - 34px);height:calc(100dvh - 34px);margin-top:34px}
body.has-tb .settings,body.has-tb .lightbox{top:34px}
body.has-tb #app.free>.isle{margin-top:0}
body[data-theme=aero] #titlebar{background:linear-gradient(#ffffffd0,#d8f0ffc0);color:#0b4a6f;border-bottom-color:#ffffff}
body[data-theme=v2015] #titlebar{background:#202225;border-bottom:0;color:#72767d}
kbd{font:600 12px var(--mono,monospace);padding:3px 8px;border-radius:6px;background:var(--bg3);border:1px solid var(--line);margin-left:auto}
/* ---------- visualizador de fotos ---------- */
.lightbox.v2{padding:0;gap:0;background:rgba(6,6,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);justify-content:stretch;align-items:stretch;outline:0}
.lb-top{display:flex;align-items:center;gap:4px;padding:10px 14px;color:#fff;z-index:2}
.lb-top button{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;opacity:.85}
.lb-top button:hover{background:rgba(255,255,255,.12);opacity:1}
.lb-name{display:flex;flex-direction:column;min-width:0;max-width:40vw}.lb-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb-name small{opacity:.6}
.lb-z{min-width:52px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;opacity:.85}
.lb-sep{width:1px;height:22px;background:rgba(255,255,255,.2);margin:0 6px}
.lb-stage{flex:1;position:relative;overflow:hidden;display:grid;place-items:center;min-height:0}
.lb-stage img{max-width:calc(100vw - 140px);max-height:calc(100dvh - 190px);object-fit:contain;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.6);transition:transform .16s var(--ease),opacity .2s;cursor:zoom-in;user-select:none;touch-action:none}
.lb-stage img.zoomed{cursor:grab}.lb-stage img.grab{cursor:grabbing;transition:none}
.lb-stage img.loading{opacity:.3}
.lb-arrow{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff;z-index:2}
.lb-arrow:hover{background:rgba(255,255,255,.22)}.lb-arrow.l{left:18px}.lb-arrow.r{right:18px}
.lb-thumbs{display:flex;gap:8px;justify-content:center;padding:10px 14px 14px;overflow-x:auto;scrollbar-width:none;flex:none}
.lb-thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;opacity:.45;cursor:pointer;border:2px solid transparent;flex:none;transition:opacity .15s}
.lb-thumbs img:hover{opacity:.8}.lb-thumbs img.on{opacity:1;border-color:var(--accent)}
@media (max-width:820px){.lb-stage img{max-width:100vw;max-height:calc(100dvh - 170px)}.lb-arrow{display:none}.lb-top .lb-sep,.lb-top button[title^="Abrir"],.lb-top button[title^="Copiar"]{display:none}}
/* ---------- bots ---------- */
.rtag.bot{background:#5865f2;color:#fff;font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;vertical-align:middle;letter-spacing:.03em}
.bot-intro{display:flex;gap:16px;align-items:center;padding:18px;margin-bottom:18px;flex-wrap:wrap}
.bot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bot-card{display:flex;gap:12px;align-items:center;padding:14px;color:var(--fg)}
.bot-card:hover{border-color:var(--accent)}
.bot-ed{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px;align-items:start}
.bot-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.bot-meta{display:flex;gap:14px;align-items:flex-end;padding:14px 16px;flex-wrap:wrap}
.bot-av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800;cursor:pointer;position:relative;flex:none}
.bot-av span{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--bg3);color:var(--fg);display:grid;place-items:center;border:2px solid var(--bg2)}
.colorpick{width:44px;height:38px;border:0;background:none;padding:0;cursor:pointer}
.bot-scope{display:flex;flex-direction:column;gap:6px}.chk{display:flex;align-items:center;gap:8px;cursor:pointer}.chk input{accent-color:var(--accent);width:16px;height:16px}
.flow{border-radius:var(--r);padding:12px;background:color-mix(in srgb,var(--bg3) 60%,transparent);border:1px solid var(--line)}
.flow.off{opacity:.5}
.blk{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;color:#fff;margin-bottom:6px;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.blk .input{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.18);color:#fff;padding:6px 10px;flex:1;min-width:140px}
.blk .input::placeholder{color:rgba(255,255,255,.55)}
.blk textarea.input{width:100%;flex-basis:100%;resize:vertical;min-height:38px}
.blk .input.num{max-width:80px;min-width:70px;flex:none}.blk .input.sel{flex:none;min-width:0;width:auto}
.blk select option{color:#000}
.blk-h{font-weight:800;font-size:12.5px;letter-spacing:.02em;display:flex;align-items:center;gap:6px;text-transform:uppercase}
.blk-s{font-size:13px;opacity:.9}.blk-hint{flex-basis:100%;opacity:.75;font-size:11.5px}
.blk.trig{background:linear-gradient(135deg,#f59f00,#f76707);border-radius:16px 16px 12px 12px}
.blk.msg{background:linear-gradient(135deg,#4c6ef5,#7048e8)}
.blk.ctl{background:linear-gradient(135deg,#0ca678,#099268)}
.blk.var{background:linear-gradient(135deg,#e64980,#c2255c)}
.blk-stack{margin-left:18px;padding-left:12px;border-left:3px dashed color-mix(in srgb,var(--fg3) 50%,transparent);min-height:8px}
.blk-grip{cursor:grab;opacity:.7;display:grid}
.blk-tools{margin-left:auto;display:flex;gap:2px}.blk-tools .icon-btn{width:26px;height:26px;color:#fff}
.blk.dragging{opacity:.4}.blk.over{outline:3px solid #fff;outline-offset:2px}
.blk .icon-btn{color:#fff}
.blk-add{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 18px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;opacity:.85}
.chip:hover{opacity:1;transform:translateY(-1px)}
.chip.msg{background:#5c5ff0}.chip.ctl{background:#0ca678}.chip.var{background:#d6336c}
.bot-side{position:sticky;top:0;padding:14px;display:flex;flex-direction:column;gap:8px}
.bot-log{height:280px;overflow-y:auto;background:var(--bg1);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.bl{padding:6px 10px;border-radius:10px;background:var(--bg3);align-self:flex-start;max-width:90%}.bl b{display:block;font-size:11.5px;color:var(--accent)}
.bl.me{align-self:flex-end;background:color-mix(in srgb,var(--accent) 25%,var(--bg3))}
.bot-vars{display:flex;flex-wrap:wrap;gap:5px}.bot-vars code{cursor:pointer;font-size:11.5px;padding:2px 6px;border-radius:5px;background:var(--bg3)}
.bot-vars code:hover{background:var(--accent);color:var(--on-accent)}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:1000px){.bot-ed{grid-template-columns:1fr}.bot-side{position:static}}
/* ---------- celular sem bordas ---------- */
@media (max-width:820px){
  #app{padding:0!important;gap:0!important}
  #app>.isle{border-radius:0!important;border:0!important;box-shadow:none!important}
  .main .top{padding-top:max(env(safe-area-inset-top),0px)}
}
/* ---------- v3.8 ---------- */
/* contraste: tudo que fica em cima da cor de destaque usa --on-accent */
.toggle.on::after{background:#fff}
.bgroup.mine .bubble a,.bgroup.mine .bubble .mention{color:var(--on-accent)}
.cbtn.on,.chip2.on,.react.mine b{color:var(--on-accent)}
.item.on{color:var(--fg)}
/* abertura */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg0);transition:opacity .55s var(--ease),visibility .55s;cursor:default}
#splash.out{opacity:0;visibility:hidden}
.sp-glow{position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 38%,transparent),transparent 65%);filter:blur(30px);animation:spGlow 2.6s ease-in-out infinite alternate}
.sp-logo{position:relative;width:120px;height:120px;animation:spIn 1.1s cubic-bezier(.2,1.4,.4,1) both}
.sp-logo svg{width:120px;height:120px;filter:drop-shadow(0 10px 30px color-mix(in srgb,var(--accent) 55%,transparent))}
.sp-name{position:relative;font:800 26px var(--font);letter-spacing:.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:spUp .8s .45s both}
.sp-fact{position:relative;max-width:min(420px,86vw);min-height:44px;text-align:center;color:var(--fg2);font-size:14px;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.sp-fact.in{opacity:1;transform:none}
@keyframes spIn{0%{opacity:0;transform:scale(.3) rotate(-25deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spGlow{from{transform:scale(.85);opacity:.7}to{transform:scale(1.1);opacity:1}}
/* partículas */
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#particles i{position:absolute;top:-20px;border-radius:50%;background:#fff;opacity:.85;animation:snowfall linear infinite;box-shadow:0 0 6px #ffffffaa}
#particles[data-kind=spooky] i{top:auto;bottom:-30px;animation-name:floatup}
#particles i.ember{background:radial-gradient(circle,#ffb347,#ff7518 60%,transparent 70%);box-shadow:0 0 12px #ff7518}
#particles i.bat{background:none;box-shadow:none;border-radius:0;opacity:.75}
#particles i.bat::before{content:"";position:absolute;inset:0;background:#120814;clip-path:polygon(50% 30%,62% 10%,66% 34%,100% 18%,84% 58%,66% 52%,50% 80%,34% 52%,16% 58%,0 18%,34% 34%,38% 10%)}
@keyframes snowfall{to{transform:translate(var(--drift),110vh)}}
@keyframes floatup{0%{transform:translate(0,0);opacity:0}10%{opacity:.85}100%{transform:translate(var(--drift),-115vh);opacity:0}}
body[data-theme=natal] .srv-banner::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:radial-gradient(circle at 6px 0,#fff 5px,transparent 6px) 0 0/16px 10px repeat-x}
body[data-theme=halloween] .pill.logo .cuplogo{filter:drop-shadow(0 0 10px #ff7518)}
/* presença */
.dot.old{background:var(--ok)!important;display:grid!important;place-items:center}
.dot.old::after{content:"!";font:900 9px/1 var(--font);color:#111}
.avatar.xl .dot.old::after{font-size:13px}
.dot.ghost{background:transparent!important;box-shadow:inset 0 0 0 2px var(--fg3)}
.plat{display:inline-grid;vertical-align:middle;color:var(--fg3);margin-left:2px}
.rbadge{display:inline-grid;vertical-align:middle;margin-left:4px;cursor:help}
.rbadge.owner{color:#fbbf24;filter:drop-shadow(0 0 6px #fbbf2466)}
.rbadge.staff{color:var(--accent)}
.srv-own{color:#fbbf24;display:inline-grid;vertical-align:middle}
/* emojis e reações */
.cemoji{width:1.375em;height:1.375em;object-fit:contain;vertical-align:-.3em;display:inline-block}
.cemoji.big{width:32px;height:32px}
.text.jumbo{font-size:2.6em;line-height:1.15}.text.jumbo .cemoji{width:48px;height:48px;vertical-align:-.2em}
.bubble .text.jumbo{padding:0}
.bgroup .bubble:has(.text.jumbo){background:transparent!important;box-shadow:none!important;padding:0}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.bgroup.mine .reacts{justify-content:flex-end}
.react{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:9px;background:var(--bg3);border:1px solid var(--line);font-size:14px;color:var(--fg)}
.react b{font-size:12px;color:var(--fg2)}
.react:hover{border-color:var(--fg3)}
.react.mine{background:color-mix(in srgb,var(--accent) 22%,var(--bg3));border-color:var(--accent)}
.react.mine b{color:var(--fg)}
.react .cemoji{width:18px;height:18px;vertical-align:middle}
.react.add{opacity:0;color:var(--fg2);transition:opacity .12s}
.brow:hover+.reacts .react.add,.reacts:hover .react.add,.msg:hover .react.add{opacity:1}
.ctx-quick{display:flex;gap:2px;padding:4px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ctx-quick button{width:34px;height:34px;padding:0!important;justify-content:center;font-size:19px;border-radius:8px}
.ctx-label{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--fg3);padding:6px 10px}
.ctx button:disabled{opacity:.4;pointer-events:none}
.pop-bg{position:fixed;inset:0;z-index:90}
.pop{position:fixed;background:var(--bg2);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.45);padding:10px;animation:fade .12s}
.pop.ep{width:340px}.pop.gp{width:420px}
.ep-body{max-height:300px;overflow-y:auto;margin-top:8px}
.ep-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3);margin:8px 2px 4px}
.ep-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.ep-grid button,.ep-quick button{height:36px;border-radius:8px;font-size:21px;display:grid;place-items:center}
.ep-grid button:hover,.ep-quick button:hover{background:var(--hover)}
.ep-grid .cemoji{width:26px;height:26px}
.ep-quick{display:flex;gap:2px;margin-bottom:8px}.ep-quick button{flex:1}
.em-list{max-height:320px;overflow-y:auto}
.em-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
/* GIFs */
.gp-grid{columns:3 120px;column-gap:6px;max-height:340px;overflow-y:auto;margin-top:8px}
.gp-grid button{display:block;width:100%;margin-bottom:6px;border-radius:8px;overflow:hidden;break-inside:avoid;background:var(--bg3)}
.gp-grid img{width:100%;display:block}.gp-grid>div{column-span:all;padding:4px}
.gp-grid button:hover{outline:2px solid var(--accent)}
.gp-foot{font-size:10.5px;color:var(--fg3);text-align:right;margin-top:6px;font-weight:700;letter-spacing:.04em}
.att.gifv{max-width:min(300px,100%);border-radius:10px;overflow:hidden;cursor:zoom-in}
.att.gifv img,.att.gifv video{display:block;width:100%}
.bgroup .bubble:has(.att.gifv:only-child){background:transparent!important;padding:0;box-shadow:none!important}
/* formatação */
.mdh{display:block;font-weight:800;line-height:1.25;margin:2px 0}.mdh.h1{font-size:1.6em}.mdh.h2{font-size:1.3em}.mdh.h3{font-size:1.1em}
.mdsub{display:block;font-size:.8em;color:var(--fg3)}
.bgroup.mine .mdsub{color:inherit;opacity:.75}
.mdq{display:block;border-left:3px solid currentColor;padding-left:9px;opacity:.85}
.mdli{display:block}.mdli::before{content:"•";margin-right:8px;font-weight:900}
.text u{text-underline-offset:2px}
.text mark{background:#fde04788;color:inherit;border-radius:3px;padding:0 2px}
.spoiler{background:var(--fg3);color:transparent;border-radius:4px;cursor:pointer;transition:.2s;padding:0 2px}
.spoiler *{visibility:hidden}.spoiler.on{background:rgba(127,127,127,.25);color:inherit}.spoiler.on *{visibility:visible}
.composer{position:relative}
.fmtbar{position:absolute;left:16px;bottom:calc(100% - 6px);z-index:20;display:flex;gap:2px;padding:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:fade .1s}
.fmtbar button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--fg2)}
.fmtbar button:hover{background:var(--hover);color:var(--fg)}
/* busca */
.searchpane{width:320px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sp-head{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.sp-head .input{padding:7px 10px}
.sp-res{flex:1;overflow-y:auto}
.sp-item{display:flex;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.sp-item:hover{background:var(--hover)}
.sp-txt{font-size:13.5px;color:var(--fg2);overflow-wrap:anywhere}
.sp-txt mark{background:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--fg);border-radius:3px}
@media (max-width:820px){.searchpane{position:absolute;inset:0;width:auto;z-index:15;background:var(--bg1)}}
/* categorias */
.cat-h{display:flex;align-items:center;cursor:pointer;user-select:none}
.cat-name{flex:1;display:flex;align-items:center;gap:4px}
.cat-name .ic{transition:transform .15s}
.cat-h.closed .cat-name .ic{transform:rotate(-90deg)}
.cat-acts{display:flex;gap:2px;opacity:.0;transition:opacity .12s}
.cat-h:hover .cat-acts{opacity:1}
.cat-acts .icon-btn{width:22px;height:22px}
.cat-body{min-height:4px}
.chanlist .over{box-shadow:inset 0 -2px 0 var(--accent)}
.chanlist .cat-body.over,.chanlist .cat-h.over{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:8px}
.chanlist .dragging{opacity:.4}
.add-cat{width:100%;opacity:.7;margin-top:6px;justify-content:flex-start;text-align:left}.add-cat:hover{opacity:1}
/* temas salvos */
.mythemes{padding:14px 16px;margin:6px 0 18px}
.mt-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.mt-item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--bg3)}
.mt-pv{width:42px;height:30px;border-radius:8px;position:relative;overflow:hidden;flex:none;border:1px solid var(--line)}
.mt-pv span{position:absolute;right:0;top:0;bottom:0;width:40%}
/* CupClip */
.cc-bg{align-items:center}
.cupclip{width:min(1100px,96vw);height:min(720px,92vh);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.cupclip.busy .cc-side,.cupclip.busy .cc-stage{pointer-events:none;opacity:.75}
.cc-head,.cc-foot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cc-foot{border-bottom:0;border-top:1px solid var(--line);position:relative}
.cc-main{flex:1;display:flex;min-height:0}
.cc-stage{flex:1;position:relative;display:grid;place-items:center;background:#000;min-width:0;overflow:hidden;touch-action:none}
.cc-stage video{display:none}
.cc-stage canvas{max-width:100%;max-height:100%;display:block}
#cctexts{position:absolute;inset:0;pointer-events:none}
.cc-text{position:absolute;transform:translate(-50%,-50%);border:1.5px dashed rgba(255,255,255,.5);border-radius:6px;cursor:move;pointer-events:auto}
.cc-text.on{border-color:var(--accent);border-style:solid}
.cc-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;transition:opacity .2s}
.cc-play.playing{opacity:0}.cc-stage:hover .cc-play.playing{opacity:.85}
.cc-side{width:330px;flex:none;overflow-y:auto;padding:12px 16px;border-left:1px solid var(--line)}
.cc-sec{padding:10px 0;border-bottom:1px solid var(--line)}
.cc-sec>label{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;margin-bottom:8px}
.cc-row{display:flex;align-items:center;gap:8px}
.cc-trim{position:relative;height:28px}
.cc-trim input{position:absolute;inset:0;width:100%;pointer-events:none;background:none;-webkit-appearance:none;appearance:none}
.cc-trim input::-webkit-slider-thumb{pointer-events:auto}
.cc-trim input::-moz-range-thumb{pointer-events:auto}
.cc-t{padding:8px;border-radius:10px;background:var(--bg3);margin-top:8px;display:flex;flex-direction:column;gap:6px;border:1px solid transparent}
.cc-t.on{border-color:var(--accent)}
.cc-t input[type=color]{width:30px;height:28px;border:0;background:none;padding:0}
.cc-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{padding:5px 10px;border-radius:99px;background:var(--bg3);font-size:12.5px;font-weight:700;text-transform:capitalize}
.chip2.on{background:var(--grad)}
.cc-prog{position:absolute;left:0;right:0;top:-1px;height:3px}
.cc-prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
@media (max-width:820px){.cc-main{flex-direction:column}.cc-side{width:auto;border-left:0;border-top:1px solid var(--line);max-height:45%}.cupclip{width:100vw;height:100dvh;border-radius:0}}
/* ---------- v3.9 ---------- */
.danger-btn{background:var(--busy)!important;color:#fff!important}
/* dicas estilizadas */
.ctip{position:fixed;z-index:10000;pointer-events:none;max-width:280px;padding:7px 11px;border-radius:9px;background:var(--bg0);color:var(--fg);font-size:12.5px;font-weight:700;line-height:1.3;box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 0 1px var(--line);opacity:0;transform:translateY(4px) scale(.96);transition:opacity .12s,transform .12s}
.ctip.on{opacity:1;transform:none}
.ctip::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);box-shadow:1px 1px 0 var(--line)}
.ctip.below::after{bottom:auto;top:-5px;box-shadow:-1px -1px 0 var(--line)}
/* nada de seleção/arrasto de navegador em botões e menus */
button,.item,.pill,.tab,.seg,.side-label,.rail,.top h1,.cat-h,.react,.chip,.chip2{-webkit-user-select:none;user-select:none}
img{-webkit-user-drag:none}
/* CLAUT */
.claut{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);animation:fade .2s}
.claut-card{width:min(470px,calc(100% - 32px));background:var(--bg2);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);padding:16px 20px 18px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pop .35s var(--ease);position:relative;overflow:hidden}
.claut-card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--grad)}
.claut-top{display:flex;align-items:center;gap:8px;color:var(--fg3)}
.claut-badge{font:900 11px var(--font);letter-spacing:.14em;padding:4px 9px;border-radius:7px;background:var(--grad);color:var(--on-accent)}
.claut-body{display:flex;gap:16px;align-items:center;margin:16px 0 8px}
.claut-body h2{margin:0 0 4px;font-size:21px}.claut-body p{margin:0}
.claut-logo{position:relative;flex:none;width:64px;height:64px;animation:clautBob 2.4s ease-in-out infinite}
.claut-logo i{position:absolute;inset:-10px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--accent) 60%,transparent);animation:spin 8s linear infinite}
@keyframes clautBob{50%{transform:translateY(-4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.claut-bar{height:6px;border-radius:9px;background:var(--bg3);overflow:hidden;margin-top:6px}.claut-bar i{display:block;height:100%;width:0;background:var(--grad)}
/* termos */
.terms-gate{position:fixed;inset:0;z-index:9500;display:grid;place-items:center;background:color-mix(in srgb,var(--bg0) 88%,transparent);backdrop-filter:blur(10px)}
.terms-card{width:min(640px,calc(100% - 24px));max-height:calc(100dvh - 40px);display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.terms-head{display:flex;gap:14px;align-items:center}.terms-head h2{margin:0}
.terms-scroll{flex:1;min-height:160px;max-height:52vh;overflow-y:auto;margin:14px 0;padding:4px 14px;border-radius:12px;background:var(--bg1);border:1px solid var(--line)}
.terms-txt{white-space:pre-wrap;font-size:13.5px;line-height:1.55;color:var(--fg2)}
.terms-txt b{color:var(--fg)}.terms-txt .mdh{color:var(--fg);margin-top:8px}
.terms-chk{font-weight:700}
.terms-card .acts,.claut-card .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
/* modo desempenho */
body.perf .isle,body.perf .panel,body.perf .modal,body.perf .ctx,body.perf .settings,body.perf .pop,body.perf #titlebar,body.perf .claut,body.perf .terms-gate{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.perf .isle{background:var(--bg1)!important;box-shadow:none!important}
body.perf *,body.perf *::before,body.perf *::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.05s!important}
body.perf #splash .sp-logo,body.perf #splash .sp-fact{animation:none!important;transition:opacity .2s!important}
body.perf #wall{filter:none!important}
.chat .group,.chat .bgroup{content-visibility:auto;contain-intrinsic-size:auto 60px}
/* aparência: experimental */
.exp-card{padding:14px 16px;margin:0 0 14px;border:1px dashed color-mix(in srgb,var(--accent) 60%,transparent)}
.beta{font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);margin-left:6px;vertical-align:middle;text-transform:uppercase}
/* ===== Tema Experimental: servidores no topo, conversa centralizada, composer flutuante ===== */
@media (min-width:821px){
body.exp #app:not(.free){display:grid;grid-template-columns:270px minmax(0,1fr);grid-template-rows:66px minmax(0,1fr);gap:var(--gap)}
body.exp #app:not(.free)>.rail{grid-column:1/-1;width:auto;height:66px;flex-direction:row;padding:0 12px;gap:8px;overflow-x:auto;overflow-y:hidden}
body.exp .rail .sep{width:2px;height:28px;margin:0 4px}
body.exp .rail>div[style*="flex:1"]{flex:1}
body.exp .rail .pill{width:44px;height:44px}
body.exp .rail .pill[data-tip]::after{top:auto;bottom:-34px;left:50%;transform:translateX(-50%)}
body.exp #app:not(.free)>.side{width:auto}
body.exp .main .top{justify-content:center;border-bottom:0;background:linear-gradient(var(--panel),transparent)}
body.exp .chat{max-width:880px;margin:0 auto;width:100%}
body.exp .composer{max-width:880px;margin:0 auto 14px;width:calc(100% - 28px);padding:0}
body.exp .composer-box{border-radius:999px;padding:6px 6px 6px 10px;box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
body.exp .send-btn{border-radius:50%}
body.exp .bubble{border-radius:22px}
body.exp .members{border-radius:var(--r);margin:10px}
body.exp .srv-banner{height:84px}
body.exp .side .item{border-radius:12px}
body.exp .side .item.on{background:var(--grad);color:var(--on-accent)}
body.exp .side .item.on .hash,body.exp .side .item.on .sub{color:inherit;opacity:.85}
}
/* ---------- painel / anúncios ---------- */
.admin-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:calc(var(--r) * .6);border-bottom:1px solid var(--line)}
.admin-row:hover{background:var(--hover)}
.admin-row .grow{flex:1;min-width:0}
.admin-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.admin-row.banned{opacity:.75}
.ann-bg{position:fixed;inset:0;z-index:97;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);animation:fade .2s}
.ann{width:min(560px,100%);max-height:86vh;overflow-y:auto;border-radius:calc(var(--r) + 8px);background:var(--panel);backdrop-filter:blur(var(--blur)) saturate(1.5);border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.5);padding:26px 28px 22px;animation:pop .35s var(--ease);position:relative;overflow-x:hidden}
.ann::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--grad)}
.ann-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ann-badge{font-size:11px;font-weight:900;letter-spacing:.1em;padding:4px 10px;border-radius:999px;background:var(--grad);color:var(--on-accent)}
.ann h2{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.ann-sub{font-size:16px;color:var(--fg2);margin-top:4px;font-weight:600}
.ann-body{margin-top:16px;line-height:1.6}
.ann-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
/* ---------- cargos ---------- */
.rtag{display:inline-flex;align-items:center;vertical-align:1px;font-size:9.5px;font-weight:900;letter-spacing:.08em;padding:2px 6px;border-radius:5px;line-height:1.2;white-space:nowrap;margin-left:2px}
.rtag.staff{background:var(--grad);color:var(--on-accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 40%,transparent)}
.rtag.owner{position:relative;overflow:hidden;background:var(--grad);color:var(--on-accent);isolation:isolate;box-shadow:0 0 12px color-mix(in srgb,var(--accent2) 45%,transparent)}
.rtag.owner::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#ff3b3b,#ff9f1a,#ffe11a,#3bff6a,#1ae0ff,#5a6bff,#c43bff,#ff3b3b);background-size:200% 100%;animation:rainbowMove 2.2s linear infinite,ownerFade 6s ease-in-out infinite}
.rtag.owner span{text-shadow:0 1px 2px rgba(0,0,0,.45)}
@keyframes rainbowMove{to{background-position:200% 0}}
@keyframes ownerFade{0%,100%{opacity:1}45%{opacity:1}55%{opacity:0}90%{opacity:0}}
.reduce .rtag.owner::before{animation:none}
.edited{font-size:11.5px;color:var(--fg3)}
.p-edit textarea{margin-top:6px}
/* ---------- Cupdive ---------- */
.feed{max-width:640px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:12px}
.pcomposer{display:flex;gap:12px;padding:14px;border-radius:var(--r);background:color-mix(in srgb,var(--bg3) 75%,transparent);border:1px solid var(--line)}
.pc-main{flex:1;min-width:0}
.pcomposer textarea{width:100%;background:none;border:0;outline:0;resize:none;font-size:1.05em;line-height:1.45;padding:6px 0;max-height:320px}
.pc-bar{display:flex;align-items:center;gap:8px;margin-top:6px;border-top:1px solid var(--line);padding-top:8px;position:relative}
.pc-tools{display:flex;gap:2px;flex:1}.pc-tools .icon-btn{font-size:18px}
.pc-prev{position:relative;margin-top:8px;border-radius:calc(var(--r) * .7);overflow:hidden;max-width:100%}
.pc-prev img,.pc-prev video{display:block;max-width:100%;max-height:360px;border-radius:calc(var(--r) * .7)}
.pc-x{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:13px}
.post{display:flex;gap:12px;padding:14px 14px 8px;border-radius:var(--r);background:color-mix(in srgb,var(--bg3) 55%,transparent);border:1px solid var(--line);cursor:pointer;transition:background .15s,transform .15s;animation:rise .25s var(--ease)}
.post:hover{background:color-mix(in srgb,var(--bg3) 80%,transparent)}
.post.detail{cursor:default;padding:18px 18px 10px}.post.detail .p-text{font-size:1.15em}
.post.reply{cursor:default;background:transparent;border:0;border-radius:0;padding:10px 4px 2px;border-bottom:1px solid var(--line)}
.thread{margin-left:22px;padding-left:14px;border-left:2px solid var(--line)}
.p-body{flex:1;min-width:0}
.p-head{display:flex;align-items:center;gap:6px;min-width:0}
.p-head b{cursor:pointer;white-space:nowrap}.p-head b:hover{text-decoration:underline}
.p-head .muted{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-more{margin-left:auto;width:30px;height:30px;opacity:.5}.post:hover .p-more{opacity:1}
.p-text{margin-top:3px;word-wrap:break-word}
.pmedia{margin-top:10px;border-radius:calc(var(--r) * .75);overflow:hidden;border:1px solid var(--line);background:#000;max-height:520px;display:flex;justify-content:center}
.pmedia img{display:block;width:100%;max-height:520px;object-fit:cover;cursor:zoom-in}
.pmedia video{display:block;width:100%;max-height:520px;background:#000}
.p-actions{display:flex;gap:4px;margin-top:6px;margin-left:-8px}
.pa{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;color:var(--fg3);font-weight:650;font-size:13.5px;min-width:52px;transition:color .15s,background .15s}
.pa:hover{background:var(--hover);color:var(--fg)}
.pa .heart{font-size:17px;line-height:1}
.pa.liked{color:#fb7185}.pa.liked:hover{background:color-mix(in srgb,#fb7185 12%,transparent)}
.pa.pop .heart{animation:heartpop .35s var(--ease)}
@keyframes heartpop{40%{transform:scale(1.5)}100%{transform:scale(1)}}
.reply-slot:not(:empty){margin:6px 0 8px}.reply-slot .pcomposer{padding:10px}
.replies-head{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);margin:10px 4px 0}
.fresh-pill{position:sticky;top:8px;z-index:3;align-self:center;padding:8px 16px;border-radius:999px;background:var(--grad);color:var(--on-accent);font-weight:800;font-size:13.5px;box-shadow:0 10px 28px rgba(0,0,0,.3);animation:pop .25s var(--ease)}
/* ---------- voz ---------- */
.voice{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--bg4);margin-top:8px;max-width:340px;min-width:220px}
.bubble .voice{background:transparent;margin:0;padding:2px 4px 2px 0;min-width:200px}
.vplay{width:36px;height:36px;border-radius:50%;background:var(--grad);color:var(--on-accent);font-size:13px;flex:none;display:grid;place-items:center}
